server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # -------------------------------------------------------------------------
    # CABEÇALHOS DE SEGURANÇA — e por que eles aparecem TRÊS vezes
    #
    # ⚠ SE FOR MEXER AQUI, LEIA ISTO PRIMEIRO.
    #
    # `add_header` no nginx não se acumula por nível: um `add_header` dentro de
    # um `location` DESCARTA todos os herdados do `server`. Não é aviso, não é
    # erro de configuração, não aparece em `nginx -t`. Os cabeçalhos somem em
    # silêncio.
    #
    # Como os três `location` abaixo precisam de `Cache-Control` próprio, todos
    # precisam repetir os cabeçalhos de segurança. Declará-los uma vez no
    # `server` faria a resposta de `/` — o DOCUMENTO, o único lugar onde a CSP
    # tem efeito — sair só com `Cache-Control`.
    #
    # E a API continuaria mandando os dela, então `curl -I .../api/saude` daria
    # a impressão de que está tudo certo. A conferência que vale é sobre a
    # PÁGINA:
    #
    #     curl -skI https://<host>/ | grep -i content-security-policy
    #
    # Se um dia mudar, mude nos três.
    #
    # `__HSTS__` também é substituído no build, e vira NADA por padrão.
    #
    # HSTS é por HOST, não por resposta: em produção o painel e a API ficam na
    # mesma origem, e o cabeçalho que a API já manda cobriria o host de qualquer
    # jeito — MAS só depois de o navegador ter feito uma chamada de API. Quem
    # chega pela primeira vez carrega a PÁGINA antes de qualquer `fetch`, e é
    # justamente essa primeira visita que o HSTS existe para proteger.
    #
    # Fica desligado por padrão porque ligar HSTS numa origem sem HTTPS válido —
    # a pilha local usa certificado autoassinado — faz o navegador se recusar a
    # voltar, e por um ano, inclusive para outros projetos no mesmo host.
    #
    # `__CONNECT_SRC__` é substituído NO BUILD, a partir de `VITE_API_URL` e da
    # connection string do Application Insights — ver o `Dockerfile`.
    # Endereço fixo aqui seria o mesmo fato escrito em dois lugares, e dois
    # lugares para um fato é como eles se desencontram.
    # -------------------------------------------------------------------------

    # A navegação do painel é por estado, não por URL — mas o `try_files` fica
    # de qualquer forma: sem ele, qualquer caminho fora da raiz devolve 404 do
    # nginx em vez da aplicação, e um link compartilhado quebraria.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        __HSTS__
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src __CONNECT_SRC__; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # O bundle tem hash no nome (`index-DUiLxn5G.js`), então pode ser guardado
    # para sempre: um deploy novo gera nome novo. O `index.html` NÃO pode — é
    # ele que aponta para o bundle, e guardado faria o navegador continuar
    # pedindo a versão antiga depois do deploy.
    location ~* \.(js|css|woff2?|png|svg|jpg|webp)$ {
        # Um `Cache-Control` só, e por isso NÃO se usa `expires` aqui: a
        # diretiva emite o seu próprio cabeçalho, e dois dizendo a mesma coisa é
        # como um deles fica para trás quando o outro muda.
        add_header Cache-Control "public, max-age=31536000, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        __HSTS__
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src __CONNECT_SRC__; frame-ancestors 'none'; base-uri 'none'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store";

        # Os cabeçalhos de segurança da API não valem aqui: são respostas
        # diferentes, de um servidor diferente. A CSP abaixo é a do DOCUMENTO, e
        # precisa permitir o que o painel de fato usa.
        #
        # `unsafe-inline` em `style-src` porque o painel usa estilo inline em
        # quase todo componente. Tirar exigiria reescrever a estilização
        # inteira — está registrado como dívida, não como esquecimento.
        #
        # `connect-src` precisa do endereço da API: sem ele, o navegador bloqueia
        # toda chamada e a tela fica vazia sem erro visível no servidor.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        __HSTS__
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src __CONNECT_SRC__; frame-ancestors 'none'; base-uri 'none'" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
