server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # -------------------------------------------------------------------------
    # CABEÇALHOS DE SEGURANÇA — e por que eles aparecem TRÊS vezes
    #
    # ⚠ SE FOR MEXER AQUI, LEIA ISTO PRIMEIRO.
    #
    # `add_header` no nginx não se acumula por nível: um `add_header` dentro de
    # um `location` DESCARTA todos os herdados do `server`. Não é aviso, não é
    # erro de configuração, não aparece em `nginx -t`. Os cabeçalhos somem em
    # silêncio.
    #
    # Como os três `location` abaixo precisam de `Cache-Control` próprio, todos
    # precisam repetir os cabeçalhos de segurança. Declará-los uma vez no
    # `server` faria a resposta de `/` — o DOCUMENTO, o único lugar onde a CSP
    # tem efeito — sair só com `Cache-Control`.
    #
    # E a API continuaria mandando os dela, então `curl -I .../api/saude` daria
    # a impressão de que está tudo certo. A conferência que vale é sobre a
    # PÁGINA:
    #
    #     curl -skI https://<host>/ | grep -i content-security-policy
    #
    # Se um dia mudar, mude nos três.
    #
    # `__HSTS__` também é substituído no build, e vira NADA por padrão.
    #
    # HSTS é por HOST, não por resposta: em produção o painel e a API ficam na
    # mesma origem, e o cabeçalho que a API já manda cobriria o host de qualquer
    # jeito — MAS só depois de o navegador ter feito uma chamada de API. Quem
    # chega pela primeira vez carrega a PÁGINA antes de qualquer `fetch`, e é
    # justamente essa primeira visita que o HSTS existe para proteger.
    #
    # Fica desligado por padrão porque ligar HSTS numa origem sem HTTPS válido —
    # a pilha local usa certificado autoassinado — faz o navegador se recusar a
    # voltar, e por um ano, inclusive para outros projetos no mesmo host.
    #
    # A CSP TEM DUAS PARTES, e a divisão é a mesma da imagem:
    #
    #   `__CONNECT_SRC__`      substituído NO BUILD, a partir de `VITE_API_URL` —
    #                          só existe quando alguém constrói apontando para uma
    #                          API de OUTRA origem. Vazio no caso normal, em que o
    #                          bundle chama `/api` aqui mesmo e `'self'` basta.
    #   `${CSP_CONNECT_EXTRA}` substituído NA SUBIDA, com os endereços do
    #                          Application Insights extraídos da connection string
    #                          do ambiente — ver `/docker-entrypoint.d/`.
    #
    # A SEGUNDA PARTE É DE RUNTIME PORQUE A TELEMETRIA É: assá-la na imagem
    # obrigava a um build por ambiente. Origem fora do `connect-src` é bloqueada
    # pelo navegador, e a telemetria sumiria sem erro no servidor — justamente o
    # tipo de falha que ela existe para mostrar.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # A API NA MESMA ORIGEM
    #
    # O contêiner da API não tem endereço público: quem alcança o back é este
    # nginx, por dentro do ambiente. Para o navegador, painel e API são um host
    # só — o que dispensa CORS e faz o cookie de sessão ser de primeira parte.
    #
    # `${API_UPSTREAM}` é substituído QUANDO O CONTÊINER SOBE, e não no build:
    # o endereço interno do back só existe depois de ele existir. Quem
    # substitui é o `envsubst` da imagem oficial do nginx, e por isso este
    # arquivo mora em `/etc/nginx/templates/`.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;

        # NÃO reescreva o Host. O ingress do Container Apps roteia PELO Host:
        # ele precisa chegar como `ca-back-….internal.…`, que é o padrão do
        # nginx quando nada é definido.

        # O back lê `X-Forwarded-For` da DIREITA. Cada salto acrescenta uma
        # entrada, e `PROXIES_CONFIAVEIS` precisa bater com o número delas —
        # errar para baixo faz o limite de taxa agrupar todo mundo no IP do
        # proxy, e um cliente barulhento derruba os outros.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # ESTE NÚMERO FICA ACIMA DO MAIOR TETO DA APLICAÇÃO, e a ordem importa:
        # o nginx vem primeiro. Se ele cortar antes, sai um 413 seco dele, e a
        # mensagem da rota — que diz o tamanho aceito — nunca aparece. O padrão
        # do nginx é 1 MB, e recusaria qualquer um destes arquivos.
        #
        # Os tetos da aplicação, de onde sai o 81:
        #
        #   planilha de score   80 MB   `ingerir_mencoes.TAMANHO_MAXIMO`
        #   material de agenda  25 MB   `configuracao.blob_tamanho_maximo`
        #   corpo genérico       1 MB   `protecao_http.TAMANHO_MAXIMO_DO_CORPO`
        #                               (as rotas de upload são isentas)
        #
        # JÁ ESTEVE DESALINHADO: era 26m aqui contra 40 MB de planilha, então
        # qualquer arquivo entre 26 e 40 MB levava o 413 do nginx em vez da
        # explicação do domínio. É o mesmo defeito que este arquivo conserta
        # mais abaixo — a camada de fora engolindo a mensagem da de dentro.
        #
        # Quem mudar um dos dois muda o outro, e
        # `src/api/nginx.limites-do-proxy.test.ts` falha se este valor não ficar
        # acima do teto da planilha.
        client_max_body_size 81m;

        # QUANTO TEMPO O NGINX ESPERA PELO ARQUIVO — e são DOIS relógios, não um.
        #
        # ESTE É O DE SUBIR; o `proxy_read_timeout` mais abaixo é o de o back
        # RESPONDER. Eu tinha conferido só o segundo e declarado o caminho
        # protegido. Não estava: o padrão do nginx para o corpo é 60 s, e um
        # arquivo de 10,53 MB numa conexão brasileira comum não termina nisso.
        #
        # MEDIDO NO AMBIENTE, em 16/10/2026, subindo o clipping real da Clipei
        # pela tela — e o rastro é inequívoco:
        #
        #     15:13:26  POST /…/conferencia  408  0 bytes
        #     15:14:26  POST /…/conferencia  408  0 bytes
        #     15:15:26  POST /…/conferencia  408  0 bytes
        #     15:16:26  POST /…/conferencia  400  0 bytes
        #
        # 408 de 60 em 60 segundos, corpo de ZERO bytes, e o back sem registro
        # NENHUM da requisição: o nginx encerrava a leitura do corpo e o
        # navegador reenviava. Para quem está na tela isso se lê como "está
        # demorando", que é o pior desfecho possível — não há erro para
        # investigar e o arquivo nunca chega.
        #
        # 300 s, E NÃO 60: dá ~360 kB/s de piso para os 80 MB do teto e folga
        # grande para os 10,53 MB reais. O `client_body_timeout` conta entre
        # duas LEITURAS e não o envio inteiro, então um valor alto não prende
        # conexão parada por mais tempo que isso.
        #
        # SÓ O CORPO, E NÃO O CABEÇALHO. Eu havia posto `client_header_timeout`
        # aqui junto, "pelo mesmo motivo" — e o `nginx -t` recusou: aquela
        # diretiva não é permitida em `location`, só em `http` e `server`. O
        # teste que lê este arquivo como TEXTO passou com ela, porque texto não
        # sabe de contexto. Fica de fora: o cabeçalho é curto, nunca foi o
        # problema, e subi-lo no servidor inteiro seria mudança sem motivo.
        client_body_timeout 300s;

        # BUFFERIZAR O CORPO DA REQUISIÇÃO. O `off` que estava aqui quebrava o
        # upload de planilha — e SÓ na Azure, que é o que tornou isto difícil.
        #
        # Sem bufferizar, o nginx repassa o corpo À MEDIDA QUE ELE CHEGA — é só
        # isto que a documentação garante, e é este o fato. Na pilha local o
        # fluxo vai direto ao uvicorn e funciona. Na Azure o `ca-back` tem
        # ingress interno, então ele atravessa um Envoy antes de chegar à
        # aplicação.
        #
        # E UMA INFERÊNCIA MINHA QUE NÃO É FATO, para quem investigar isto de
        # novo: eu havia escrito aqui que o `off` fazia a requisição sair em
        # `Transfer-Encoding: chunked`, por não ter tamanho declarado. A revisão
        # derrubou — o nginx não promete converter para chunked um pedido que
        # chegou com `Content-Length`. Pode acontecer, e explicaria bem o que se
        # mediu, mas o que se procura é "corpo em fluxo atravessando o ingress",
        # e não "chunked obrigatório".
        #
        # MEDIDO EM 12/10/2026, com a planilha de 3,8 MB da Clipei:
        #
        # E O LIMIAR ESTÁ ENTRE 93 KB E 513 KB, medido com três arquivos reais:
        # o modelo de agendas (93,5 KB) sobe; a consolidada da Bites (512,7 KB)
        # e o clipping da Clipei (3.927 KB) falham. As três rotas passam por
        # ESTE bloco e as três estão isentas do teto de corpo do back, então o
        # que separa não é a rota nem o limite — é o tamanho. E tamanho é
        # exatamente o que bufferizar muda: 93 KB sai numa rajada só, 513 KB
        # para cima vai em pedaços ao longo do tempo.
        #
        #   back:    POST .../conferencia -> 400 em 22.929ms
        #   nginx:   POST .../conferencia     400    0 bytes
        #   tela:    Unexpected token '<', "<!DOCTYPE "... is not valid JSON
        #
        # Os três são o mesmo evento. O `400` é o FastAPI embrulhando uma falha
        # na leitura do corpo — o `LimiteDeCorpoMiddleware` do back documenta
        # esse embrulho com estas palavras. O corpo de ZERO byte é este nginx
        # não conseguindo repassar a resposta de um upstream que respondeu antes
        # de o corpo terminar de subir. E o HTML é o ingress da Azure
        # preenchendo um 4xx vazio com a página de erro dele.
        #
        # E BUFFERIZAR DEVOLVE AO BACK A CONFERÊNCIA BARATA: o
        # `LimiteDeCorpoMiddleware` recusa pelo `Content-Length` "antes de ler
        # um byte", e só cai na contagem byte a byte quando não há tamanho
        # declarado. O `off` tirava dele justamente o cabeçalho de que ele
        # depende — e a contagem é o caminho que termina em 400 embrulhado.
        #
        # O CUSTO é o nginx segurar o corpo antes de repassar, até os 26 MB
        # acima — em disco, acima de `client_body_buffer_size`. É o padrão do
        # nginx, e para este teto é barato.
        proxy_request_buffering on;

        proxy_connect_timeout 10s;

        # 240s PORQUE É O TETO DO INGRESS, e não porque eu queira esperar tanto.
        # Com planilha de até 80 MB, 60 s não dão: o clipping de 3,8 MB já levou
        # 22,9 s de processamento. Mas passar de 240 s não compra nada — o
        # ingress do Container Apps corta a requisição antes, e o navegador
        # recebe a página de erro DELE, que é onde esta investigação começou.
        #
        # ISSO FAZ DO TEMPO, E NÃO DO TAMANHO, O LIMITE REAL das planilhas
        # grandes: 80 MB passam pelo teto de bytes e podem não terminar em
        # 240 s. Arquivo dessa ordem pede importação em segundo plano — o
        # ambiente já roda um job (`caj-migracoes`), então o padrão existe.
        proxy_read_timeout    240s;
    }

    # A navegação do painel é por estado, não por URL — mas o `try_files` fica
    # de qualquer forma: sem ele, qualquer caminho fora da raiz devolve 404 do
    # nginx em vez da aplicação, e um link compartilhado quebraria.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        __HSTS__
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src __CONNECT_SRC__ ${CSP_CONNECT_EXTRA}; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # O bundle tem hash no nome (`index-DUiLxn5G.js`), então pode ser guardado
    # para sempre: um deploy novo gera nome novo. O `index.html` NÃO pode — é
    # ele que aponta para o bundle, e guardado faria o navegador continuar
    # pedindo a versão antiga depois do deploy.
    location ~* \.(js|css|woff2?|png|svg|jpg|webp)$ {
        # Um `Cache-Control` só, e por isso NÃO se usa `expires` aqui: a
        # diretiva emite o seu próprio cabeçalho, e dois dizendo a mesma coisa é
        # como um deles fica para trás quando o outro muda.
        add_header Cache-Control "public, max-age=31536000, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        __HSTS__
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src __CONNECT_SRC__ ${CSP_CONNECT_EXTRA}; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # A CONFIGURAÇÃO DO NAVEGADOR NÃO PODE SER GUARDADA, e esta regra existe
    # porque ela estava caindo na de `*.js` logo acima — `immutable` por um ANO.
    #
    # ACHADO DE REVISÃO, e ele derrubava o motivo de o arquivo existir: trocar a
    # connection string no ambiente não teria efeito nos navegadores que já
    # tivessem a versão antiga guardada. A telemetria "de runtime" seria de
    # runtime só na primeira visita.
    #
    # `=` (match exato) TEM PRECEDÊNCIA sobre a regra de regex, então a posição no
    # arquivo não importa — mas os cabeçalhos precisam ser repetidos, porque um
    # `location` descarta os herdados (ver o comentário no topo).
    location = /configuracao.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        __HSTS__
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src __CONNECT_SRC__ ${CSP_CONNECT_EXTRA}; frame-ancestors 'none'; base-uri 'none'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store";

        # Os cabeçalhos de segurança da API não valem aqui: são respostas
        # diferentes, de um servidor diferente. A CSP abaixo é a do DOCUMENTO, e
        # precisa permitir o que o painel de fato usa.
        #
        # `unsafe-inline` em `style-src` porque o painel usa estilo inline em
        # quase todo componente. Tirar exigiria reescrever a estilização
        # inteira — está registrado como dívida, não como esquecimento.
        #
        # `connect-src` precisa do endereço da API: sem ele, o navegador bloqueia
        # toda chamada e a tela fica vazia sem erro visível no servidor.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        __HSTS__
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src __CONNECT_SRC__ ${CSP_CONNECT_EXTRA}; frame-ancestors 'none'; base-uri 'none'" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
