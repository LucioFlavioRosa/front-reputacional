a{color:#0027BD;text-decoration:none}a:hover{color:#111799;text-decoration:underline}
.card{background:#fff;border:1px solid #E2E5F0;border-radius:4px}
.k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B7186}

.num{font-variant-numeric:tabular-nums}
.tab{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:4px;font-size:14px;font-weight:500;color:#44495C}
.tab-on{background:#EEF1F8;color:#0027BD;font-weight:700}
.selo{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:3px;font-size:12px;font-weight:700;white-space:nowrap}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%}

.seg-on{background:#0027BD;border-color:#0027BD;color:#fff;font-weight:700;position:relative}
.lg{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid #E2E5F0;border-radius:3px;background:#fff;font:inherit;font-size:13px;font-weight:700;color:#191B23;cursor:pointer}
.lg-off{color:#A6ABBD;font-weight:500;background:#FAFBFE}
.col{flex:1 1 0;min-width:0;height:100%;padding:0;margin:0;border:0;background:transparent;cursor:crosshair}
.badge{position:absolute;width:24px;height:24px;margin-left:-12px;border:2px solid #fff;border-radius:50%;padding:0;font:inherit;font-size:11px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 1px 3px rgba(25,27,35,.2)}
.badge:hover{box-shadow:0 0 0 3px rgba(0,39,189,.2)}
.pill{position:absolute;height:22px;min-width:22px;border:0;border-radius:11px;padding:0 6px;transform:translateX(-11px);font:inherit;font-size:11px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.pill:hover{box-shadow:0 0 0 3px rgba(0,39,189,.18)}
.epr{display:grid;grid-template-columns:26px minmax(0,1fr) 150px;gap:12px;align-items:center;width:100%;padding:12px 20px;border:0;border-top:1px solid #E2E5F0;background:#fff;font:inherit;color:#191B23;text-align:left;cursor:pointer}
.epr:hover{background:#F8FAFF}
.epr-on{background:#E6EAFB}
.epr-on:hover{background:#E6EAFB}
.nb{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tb{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 4px;border:0;border-bottom:3px solid transparent;background:transparent;font:inherit;font-size:15px;font-weight:500;color:#44495C;cursor:pointer}
.tb-on{border-bottom-color:#0027BD;color:#0027BD;font-weight:700}
.row{display:grid;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid #E2E5F0}
.row:hover{background:#F8FAFF}
.thd{position:sticky;top:0;z-index:2;display:grid;align-items:center;gap:16px;padding:10px 20px;background:#FAFBFE;border-bottom:1px solid #E2E5F0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-out{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid #0027BD;border-radius:4px;font-size:13px;font-weight:700;color:#0027BD;white-space:nowrap;background:#fff}
.btn-out:hover{background:#0027BD;color:#fff;text-decoration:none}
.xbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:3px;background:transparent;color:#0027BD;cursor:pointer;font:inherit}
.lnk{border:0;background:transparent;padding:0;font:inherit;font-size:13px;font-weight:700;color:#0027BD;cursor:pointer}
.lnk:hover{text-decoration:underline}
:focus-visible{outline:2px solid #0027BD;outline-offset:2px}

<body>

</div>
<div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;padding-left:56px;font-size:12px;color:#6B7186"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:10px;background:rgba(255,92,96,.16)"></span><span style="width:14px;height:10px;background:rgba(23,227,203,.22)"></span>Episódio por subtema (N3). Clique no número para filtrar.</span></div>
</div>

<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">

<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#191B23"><span style="width:10px;height:10px;border-radius:50%;background:{{k.cor}};flex:0 0 auto"></span>{{k.nome}}</span><span style="font-size:11px;color:#6B7186;white-space:nowrap">{{k.unit}}</span></div>
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
<span class="num" style="font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em">{{k.val}}</span>

<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">

<sc-for list="{{g.rows}}" as="e" hint-placeholder-count="5">

<span class="nb" style="background:{{e.cor}}">{{e.n}}</span>
<span style="min-width:0"><span style="display:block;font-size:15px;font-weight:700">{{e.n3}}</span><span style="display:block;margin-top:2px;font-size:12px;color:#6B7186">{{e.sub}}</span></span>

</button>

</div>

<section class="card" aria-label="Notícias de mercado">
<div style="padding:20px 20px 16px">
<div style="display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between">
<div style="flex:1 1 560px;min-width:0"><h2 class="ttl">{{tblTtl}}</h2><p class="syn">{{tblSyn}}</p></div>

</div>

<div class="thd" style="grid-template-columns:62px minmax(0,1.2fr) minmax(0,3.2fr) minmax(0,1.3fr) 76px 140px"><span class="k">Data</span><span class="k">{{colFonte}}</span><span class="k">{{colItem}}</span><span class="k">Subtema (N3)</span><span class="k" style="text-align:right">Impacto</span><span></span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div class="row" style="grid-template-columns:62px minmax(0,1.2fr) minmax(0,3.2fr) minmax(0,1.3fr) 76px 140px">
<span class="num" style="font-size:13px;font-weight:700">{{r.data}}</span>
<div style="min-width:0"><div style="font-size:14px;font-weight:700">{{r.fonte}}</div><div style="font-size:12px;color:#6B7186">{{r.fonteSub}}</div></div>
<div style="min-width:0"><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px"><span class="selo {{r.sc}}"><span class="dot" style="background:{{r.dc}}"></span>{{r.sl}}</span><span class="selo tier">{{r.tag}}</span></div><div class="clamp2" style="font-size:15px;line-height:1.4">{{r.tit}}</div></div>
<div style="font-size:13px;color:#44495C"><b style="color:#191B23">{{r.n3}}</b><br>{{r.conc}}</div>

<sc-if value="{{rowsEmpty}}" hint-placeholder-val="{{false}}"><div style="padding:24px 20px;font-size:14px;color:#44495C">Nenhum item nesta aba para o filtro atual.</div></sc-if>
</div></div>
</section>

<footer style="font-size:12px;line-height:1.5;color:#6B7186">Imprensa restrita a veículos de mercado financeiro e de capitais (Valor Econômico, Bloomberg Línea, Brazil Journal, InfoMoney, Exame, NeoFeed). Episódio: notícias do mesmo subtema (N3) com até 7 dias entre si; aparece quando a soma do impacto passa de 0,8 pt. Fontes: cotações ilustrativas (provedor a definir, fonte 4 do Foundation), clipping Clipei e painel de KPIs Reputacionais. Corte em 16/10/2026. Dados fictícios.</footer>
</main>
</div>
</template>
<script>

const SVGNS = 'http://www.w3.org/2000/svg';
class DCLogic {
  constructor(props) { this.props = props; this.state = null; }
  setState(o) {
    const prev = this.state || {};
    let changed = !this.state;
    for (const k in o) { if (prev[k] !== o[k]) { changed = true; break; } }
    if (!changed) return;
    this.state = Object.assign({}, prev, o);
    scheduleRender();
  }
}
class Component extends DCLogic {
  build() {
    if (this._d) return this._d;
    const DAY = 86400000;
    const days = [];
    for (let t = Date.UTC(2026, 4, 1); t <= Date.UTC(2026, 9, 16); t += DAY) { const w = new Date(t).getUTCDay(); if (w !== 0 && w !== 6) days.push(t); }
    const key = t => new Date(t).toISOString().slice(5, 10);
    const idx = {};
    days.forEach((t, i) => { idx[key(t)] = i; });
    const toT = k => Date.UTC(2026, Number(k.slice(0, 2)) - 1, Number(k.slice(3, 5)));
    const noise = (i, s) => { const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x) - 0.5; };
    const interp = (anch, amp, seed) => {
      const A = anch.map(a => [toT(a[0]), a[1]]);
      const isA = {};
      anch.forEach(a => { isA[a[0]] = 1; });
      return days.map((t, i) => {
        let v = A[A.length - 1][1];
        if (t <= A[0][0]) v = A[0][1];
        else { for (let j = 0; j < A.length - 1; j++) { if (t >= A[j][0] && t <= A[j + 1][0]) { const f = (t - A[j][0]) / (A[j + 1][0] - A[j][0]); v = A[j][1] + (A[j + 1][1] - A[j][1]) * f; break; } } }
        if (!isA[key(t)]) v += noise(i, seed) * amp;
        return v;
      });
    };
    const ser = [
      { id: 'b29', nome: 'Aegea 2029', cor: '#FE952B', w: 2.2, dash: '', kind: 'bond',
        v: interp([['05-01', 97.2], ['05-14', 97.6], ['06-03', 98.0], ['06-18', 98.5], ['07-09', 98.0], ['07-30', 97.8], ['07-31', 96.4], ['08-05', 96.1], ['08-06', 94.3], ['08-26', 94.6], ['08-27', 94.2], ['09-14', 94.9], ['09-15', 95.6], ['09-17', 96.0], ['10-07', 95.9], ['10-08', 95.4], ['10-16', 95.3]], 0.1, 2) },
      { id: 'b31', nome: 'Aegea 2031', cor: '#0027BD', w: 3, dash: '', kind: 'bond',

const PROPS = {"comSelecao": true, "periodoInicial": "6M"};
const app = document.getElementById('app');
const tpl = document.getElementById('tpl').content;
const comp = new Component(PROPS);
function lookup(path, scope) {
