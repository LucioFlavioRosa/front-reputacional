# =============================================================================
# Painel Reputacional — web: build e implantação
#
# A IMAGEM É NEUTRA DE AMBIENTE, e é isso que faz este pipeline ser curto: não há
# argumento de build com endereço de API nem connection string de telemetria. O
# bundle chama `/api` na mesma origem e o nginx encaminha; a telemetria chega por
# variável de ambiente e é escrita na subida do contêiner. Ver o `Dockerfile`.
#
# A CONSEQUÊNCIA PRÁTICA: o MESMO digest que se testou em desenvolvimento pode ser
# promovido para a homologação e para o cluster do cliente. Antes, cada ambiente
# exigia um build próprio — e a imagem publicada não era a imagem validada.
#
# `az acr build` E NÃO `docker build`: a construção acontece dentro do registry,
# então o agente não precisa de Docker nem de credencial de push.
#
# NÃO HÁ ETAPA DE MIGRATIONS AQUI. O banco é do back, e quem o migra é o pipeline
# dele. Duplicar a etapa daria duas corridas pela mesma trava.
# =============================================================================

trigger:
  branches:
    include: [main]
  paths:
    exclude: [README.md, '**/*.md']

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # O MESMO GRUPO DO BACK: os dois implantam no mesmo ambiente, e dois grupos
  # seriam dois lugares para o nome do mesmo registry.
  #
  #   CONEXAO_AZURE      conexão de serviço (ARM) com acesso ao grupo
  #   GRUPO_DE_RECURSOS  rg-painel-reputacional-aegea-dev-usce
  #   ACR                nome do registry, SEM `.azurecr.io`
  #   APP_DO_FRONT       ca-front-painel-rep-<ambiente>
  - group: painel-reputacional-dev
  - name: imagem
    value: painel-reputacional/front

stages:
  # ---------------------------------------------------------------------------
  - stage: conferir
    displayName: Testes
    jobs:
      - job: vitest
        displayName: tsc + vitest + lint
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            displayName: npm ci
          # `tsc -b` E NÃO `tsc --noEmit`: neste projeto o `--noEmit` não verifica
          # nada (o `tsconfig` é de referências de projeto), e passaria verde com
          # erro de tipo. Já aconteceu.
          - script: npx tsc -b
            displayName: tsc -b
          - script: npm test -- --run --reporter=junit --outputFile=resultado.xml
            displayName: vitest
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: resultado.xml
          # O LINT NÃO DERRUBA O PIPELINE, de propósito: o projeto carrega 21
          # avisos antigos, e tratá-los como erro aqui travaria toda entrega até
          # alguém limpar o passado. O `continueOnError` deixa o aviso visível sem
          # virar portão. Quando a conta chegar a zero, vire portão de verdade.
          - script: npm run lint
            displayName: lint (informativo)
            continueOnError: true

  # ---------------------------------------------------------------------------
  - stage: imagem
    displayName: Imagem
    dependsOn: conferir
    jobs:
      - job: acr
        displayName: az acr build
        steps:
          - task: AzureCLI@2
            name: construir
            inputs:
              azureSubscription: $(CONEXAO_AZURE)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                # SEM `--build-arg` DE AMBIENTE. Se um dia aparecer um aqui, a
                # imagem deixou de ser promovível e passou a ser de um ambiente
                # só — vale conferir se é mesmo o que se queria.
                #
                # `HSTS` fica no padrão (`off`) porque quem termina o TLS é a borda
                # do Container Apps; ligá-lo na imagem e errar o certificado
                # deixaria o host inacessível pelo prazo inteiro do cabeçalho.
                az acr build \
                  --registry "$(ACR)" \
                  --image "$(imagem):$(Build.SourceVersion)" \
                  --file Dockerfile .

                digest=$(az acr repository show \
                  --name "$(ACR)" \
                  --image "$(imagem):$(Build.SourceVersion)" \
                  --query digest -o tsv)
                echo "digest: $digest"
                echo "##vso[task.setvariable variable=digest;isOutput=true]$digest"

          # O DIGEST COMO ARTEFATO, e não só como variável de etapa: é assim que o
          # pipeline de AKS (`infra-reputacional/azure-pipelines-aks.yml`) o recebe.
          # O release no AKS é UM com DUAS imagens, e a variável de etapa não
          # atravessa a fronteira de um pipeline para outro — o artefato atravessa, e
          # o Azure DevOps entrega o do último run bem-sucedido quando este
          # pipeline não foi o que disparou o deploy.
          - bash: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)/digest"
              echo "$(construir.digest)" > "$(Build.ArtifactStagingDirectory)/digest/digest.txt"
              cat "$(Build.ArtifactStagingDirectory)/digest/digest.txt"
            displayName: Gravar o digest
          - publish: $(Build.ArtifactStagingDirectory)/digest
            artifact: digest-front

  # ---------------------------------------------------------------------------
  - stage: implantar
    displayName: Implantação
    dependsOn: imagem
    variables:
      # A SINTAXE É `<estágio>.<job>.outputs['<passo>.<variável>']`, e o passo
      # vai DENTRO das chaves. Escrito como `...acr.construir.outputs['digest']`
      # a expressão resolve para vazio e o deploy chama `--image ...@` — sem erro
      # de sintaxe, só uma imagem sem digest. Achado de revisão.
      digest: $[ stageDependencies.imagem.acr.outputs['construir.digest'] ]
    jobs:
      - deployment: container_apps
        displayName: Container Apps (dev)
        environment: painel-reputacional-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Apontar o app para a imagem nova
                  inputs:
                    azureSubscription: $(CONEXAO_AZURE)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      # O DIGEST VAZIO É O MODO DE FALHA DESTA ETAPA, e ele não dá
                      # erro de sintaxe: `--image repo@` é aceito pela linha de
                      # comando e falha lá na frente, longe da causa. Conferir aqui
                      # custa uma linha.
                      case "$(digest)" in
                        sha256:*) ;;
                        *) echo "digest invalido: '$(digest)'. A etapa da imagem nao exportou." >&2; exit 1 ;;
                      esac

                      az containerapp update \
                        --name "$(APP_DO_FRONT)" \
                        --resource-group "$(GRUPO_DE_RECURSOS)" \
                        --image "$(ACR).azurecr.io/$(imagem)@$(digest)"

                      url=$(az containerapp show \
                        --name "$(APP_DO_FRONT)" \
                        --resource-group "$(GRUPO_DE_RECURSOS)" \
                        --query properties.configuration.ingress.fqdn -o tsv)

                      # A SONDA CONFERE AS DUAS COISAS QUE A IMAGEM NEUTRA PROMETE:
                      # que a página carrega, e que `/configuracao.js` existe. O
                      # segundo é o arquivo que o contêiner escreve na subida — se
                      # ele faltar, o `index.html` dá 404 no console de toda sessão
                      # e a telemetria nunca liga, sem nada quebrar visivelmente.
                      for rota in "/" "/configuracao.js"; do
                        for _ in $(seq 1 20); do
                          codigo=$(curl -s -o /dev/null -w '%{http_code}' "https://$url$rota" || true)
                          echo "  GET $rota -> $codigo"
                          [ "$codigo" = "200" ] && break
                          sleep 6
                        done
                        [ "$codigo" = "200" ] || { echo "$rota não respondeu 200." >&2; exit 1; }
                      done
